<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WM EAT SU — Notifications</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <link rel="stylesheet" href="../../css/navbar.css" />
  <link rel="stylesheet" href="../../css/admin-css/admin-dashboard.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="../../css/notifications.css" /></head>

<body>
  <input type="checkbox" id="menu-checkbox" class="menu-checkbox" />

  <!-- ----------------------------------------
         TOP NAVBAR
         ---------------------------------------- -->
  <div class="top-nav">
    <!-- LEFT: hamburger + logo -->
    <div class="nav-left">
      <label for="menu-checkbox" class="menu-toggle">
        <i class="fa-solid fa-bars"></i>
      </label>
      <a href="admin-dashboard.html" class="logo">
        <div class="logo-icon"><i class="fa-solid fa-utensils"></i></div>
        <span class="logo-text">WM EAT SU</span>
      </a>
    </div>

    <div class="nav-center"></div>
    <!-- RIGHT: profile -->
          <div class="nav-right">
        <!-- Notifications -->
        <div class="notification-dropdown">
          <button class="nav-icon-btn" aria-label="Notifications">
            <i class="fa-regular fa-bell"></i>
            <span class="notification-badge"></span>
          </button>
          <div class="notification-menu">
            <div class="notification-header">
              <h3>Notifications</h3>
              <button class="mark-read-btn">Mark all as read</button>
            </div>
            <div class="notification-list">
              <!-- Dynamic notifications -->
            </div>
            <div class="notification-footer">
              <a href="admin-notifications.html">View all notifications</a>
            </div>
          </div>
        </div>
      <div class="profile">
        <div class="profile-info">
          <span class="profile-name">Admin</span>

        </div>
        <div class="profile-dropdown">
          <button class="profile-btn">
            <img src="../../images/pfp.jpg" class="profile-pic" alt="Profile" />
            <i class="fa-solid fa-chevron-down"></i>
          </button>
          <div class="dropdown-menu">
            <a href="../../index.html" class="dropdown-item">
              <i class="fas fa-sign-out-alt"></i><span>Log Out</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- /top-nav -->

  <!-- ----------------------------------------
         LAYOUT
         ---------------------------------------- -->
  <div class="layout">
    <!-- -- SIDEBAR -- -->
    <div class="left-nav" id="sidebar">
      <!-- logo shown on mobile inside sidebar -->

      <ul class="nav-list">
        <li>
          <a href="admin-dashboard.html" class="nav-link">
            <i class="fa-solid fa-house"></i>
            <span>Dashboard</span>
          </a>
        </li>
        <li>
          <a href="student-applications.html" class="nav-link">
            <i class="fa-solid fa-user-check"></i>
            <span>Student Applications</span>
          </a>
        </li>
        <li>
          <a href="canteen-applications.html" class="nav-link">
            <i class="fa-solid fa-store"></i>
            <span>Canteen Applications</span>
          </a>
        </li>
        <li>
          <a href="complaints.html" class="nav-link">
            <i class="fa-solid fa-comment-dots"></i>
            <span>Complaints</span>
          </a>
        </li>
        <li>
          <a href="admin-menu.html" class="nav-link">
            <i class="fa-solid fa-utensils"></i>
            <span>Menu</span>
          </a>
        </li>
        <li>
          <a href="admin-voucher.html" class="nav-link">
            <i class="fa-solid fa-ticket"></i>
            <span>Vouchers</span>
          </a>
        </li>
        <li>
          <a href="admin-analytics.html" class="nav-link">
            <i class="fa-solid fa-chart-line"></i>
            <span>Analytics</span>
          </a>
        </li>
      </ul>


    </div>

    <div class="main-content">

      <!-- Notifications Component -->
      <div class="notifications-container" id="adminNotifContainer" style="margin-top: 20px;">
        <div class="notifications-header">
          <h1>All Notifications</h1>
          <div class="notifications-filters" style="display: flex; gap: 10px; align-items: center;">
            <div class="notifications-filters">
              <button class="filter-btn active">All</button>
              <button class="filter-btn">Unread</button>
            </div>
            <button class="mark-all-read-btn" style="background: none; border: none; color: var(--admin-primary); font-size: 13px; font-weight: 600; cursor: pointer;">Mark all as read</button>
            <button class="clear-all-notif-btn" style="background: none; border: none; color: #ef4444; font-size: 13px; font-weight: 600; cursor: pointer;">Clear All</button>
          </div>
        </div>
        <div class="notifications-list">
          <!-- Dynamic notifications will be injected here -->
        </div>
      </div>
      </div>
      </div>
      <!-- /Notifications Component -->

  <script src="../../script/notifications.js"></script>
  <script src="../../script/admin-js/admin-notifications-mock.js"></script>
  <script src="../../script/admin-js/admin-dashboard.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('adminNotifContainer');
      if (container) {
        renderNotificationsPage('admin', container);
      }
    });
  </script>
</body>

</html>
